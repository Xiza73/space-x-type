[package]
name = "space-x-type"
version = "0.2.1"
description = "Juego de ritmo y mecanografía"
authors = ["Xiza73"]
license = "MIT"
repository = "https://github.com/Xiza73/space-x-type"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "space_x_type_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
# Cliente HTTPS para bajar yt-dlp. La stdlib no tiene HTTP, así que hace falta
# uno; se elige `ureq` sobre `reqwest` porque es **bloqueante** —encaja con el
# hilo donde ya corre la descarga, sin reestructurar los comandos a async— y
# porque `reqwest` ya está en el árbol pero **sin pila TLS**, así que tampoco
# salía gratis.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Verificar el hash de lo que se descarga. Ya venía como dependencia transitiva.
sha2 = "0.10"
# Parsear la URL a mano en un límite de confianza es de los errores más clásicos
# que hay. Aquí la dependencia se justifica sola.
url = "2"
# Decodificador en Rust puro. Se elige sobre los bindings de aubio/ffmpeg porque
# no arrastra una toolchain de C, que en Windows es una pelea que no vale la
# pena. Soporta AAC/m4a, que es el formato que le pedimos a yt-dlp.
symphonia = { version = "0.5", default-features = false, features = [
  # Cada formato necesita su CONTENEDOR y su CÓDEC por separado: `isomp4` lee
  # el .m4a pero las muestras adentro las decodifica `aac`, y `wav` lee el
  # contenedor pero las muestras son `pcm`. Habilitar uno solo compila igual y
  # falla solamente al abrir el archivo.
  "isomp4",
  "aac",
  "wav",
  "pcm",
  "mp3",
] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
